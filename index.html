<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>별빛 수비대</title>
  <style>
    /* ===== 화면 꾸미기 (어두운 우주 + 네온) ===== */
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #160a33 0%, #05030f 70%);
      color: white;
      font-family: "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .help { color: #8f9bd6; font-size: 14px; margin: 12px 0; text-align: center; line-height: 1.6; }
    .help b.g { color: #39ff88; text-shadow: 0 0 6px #39ff88; }
    .help b.y { color: #fff23d; text-shadow: 0 0 6px #fff23d; }

    /* 게임 화면 + 그 위에 덮는 안내판 */
    .wrap { position: relative; width: min(480px, 95vw); }
    canvas {
      display: block;
      width: 100%;
      border: 2px solid #2ef9ff;
      border-radius: 12px;
      box-shadow: 0 0 18px #2ef9ff88, 0 0 50px #ff3df233;   /* 네온 테두리 빛 */
      cursor: crosshair;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 3, 20, 0.72);
      border-radius: 12px;
    }
    .overlay.hidden { display: none; }
    .overlay h1 {
      font-size: 54px;
      margin: 0 0 10px;
      text-shadow: 0 0 8px currentColor, 0 0 24px currentColor, 0 0 48px currentColor;
    }
    .overlay p  { font-size: 18px; margin: 0 0 26px; color: #d8dcff; }
    .overlay button {
      font-size: 22px;
      font-family: inherit;
      font-weight: bold;
      padding: 12px 36px;
      border: 2px solid #ff3df2;
      border-radius: 30px;
      background: transparent;
      color: #ff3df2;
      text-shadow: 0 0 8px #ff3df2;
      box-shadow: 0 0 12px #ff3df2, inset 0 0 12px #ff3df2;
      cursor: pointer;
      transition: transform 0.1s, background 0.1s;
    }
    .overlay button:hover { transform: scale(1.06); background: #ff3df222; }

    /* 소리 켜기/끄기 버튼 (오른쪽 아래 구석) */
    .sound-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 5;
      font-size: 14px;
      font-family: inherit;
      padding: 6px 12px;
      border: 1.5px solid #2ef9ff;
      border-radius: 20px;
      background: rgba(5, 3, 20, 0.7);
      color: #2ef9ff;
      box-shadow: 0 0 8px #2ef9ff88;
      cursor: pointer;
    }
    .sound-btn.off { border-color: #6a6f99; color: #8a8fb8; box-shadow: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="480" height="640"></canvas>

    <!-- 시작 / 게임 오버 안내판 -->
    <div class="overlay" id="overlay">
      <h1 id="title" style="color:#2ef9ff">별빛 수비대</h1>
      <p id="msg">외계인 함대로부터 별빛을 지켜라!</p>
      <button id="startBtn">게임 시작</button>
    </div>

    <!-- 소리 버튼 -->
    <button class="sound-btn" id="soundBtn">🔊 소리 켬</button>
  </div>
  <div class="help">
    ← → 방향키 또는 마우스로 이동 · 스페이스바 또는 클릭으로 발사 · M 키로 소리 켜기/끄기<br>
    <b class="g">초록 아이템</b> 10초 동안 두 발 발사 · <b class="y">노란 아이템</b> 한 번 막아주는 방어막
  </div>

  <script>
    // =========================================================
    // 1. 기본 준비
    // =========================================================
    const canvas = document.getElementById("game");
    const pen = canvas.getContext("2d");   // 그림 그리는 붓
    const W = canvas.width;
    const H = canvas.height;

    const overlay  = document.getElementById("overlay");
    const titleEl  = document.getElementById("title");
    const msgEl    = document.getElementById("msg");
    const startBtn = document.getElementById("startBtn");
    const soundBtn = document.getElementById("soundBtn");

    // 게임 상태: "ready"(시작 전) / "playing"(하는 중) / "over"(게임 오버)
    let state = "ready";
    let score = 0;
    let lives = 3;          // 목숨
    let stage = 1;          // 스테이지
    let bannerTimer = 0;    // "스테이지 N" 글자를 보여주는 시간
    let time = 0;           // 애니메이션용 시간
    let shake = 0;          // 화면 흔들림 (맞았을 때)

    // 내 우주선
    const ship = {
      x: W / 2, y: H - 50, speed: 5, cooldown: 0,
      doubleShot: 0,    // 두 발 발사 남은 시간 (0이면 꺼짐)
      shield: false,    // 방어막 있는지
      invincible: 0     // 맞은 직후 잠깐 무적인 시간
    };

    let bullets = [];       // 내 총알
    let enemyBullets = [];  // 외계인 총알
    let aliens = [];        // 외계인들
    let items = [];         // 떨어지는 아이템
    let pieces = [];        // 폭발 조각
    let rings = [];         // 폭발할 때 퍼지는 빛 고리

    // 외계인 무리 전체의 움직임
    const fleet = { x: 0, y: 0, dir: 1 };

    // 네온 색깔 모음
    const NEON = {
      cyan: "#2ef9ff", pink: "#ff3df2", yellow: "#fff23d",
      green: "#39ff88", red: "#ff3b6b", orange: "#ff9b3d", white: "#f4f7ff"
    };
    // 줄마다 다른 색 (위에서부터 1~4번째 줄)
    const ALIEN_COLORS = [NEON.pink, NEON.cyan, NEON.yellow, NEON.green];
    const ROWS = 4, COLS = 8;
    const CELL_W = 46, CELL_H = 42;
    const FLEET_TOP = 70;

    // 배경 별: 3겹으로 만들어서 멀리 있는 별은 느리게, 가까운 별은 조금 빠르게 흐름
    const stars = [];
    const STAR_COLORS = ["#ffffff", "#bfe9ff", "#ffc9f6"];
    for (let i = 0; i < 110; i++) {
      const layer = i % 3;   // 0: 먼 별, 1: 중간, 2: 가까운 별
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        size: 0.6 + layer * 0.7,
        speed: 0.15 + layer * 0.25,      // 천천히 아래로
        color: STAR_COLORS[Math.floor(Math.random() * 3)]
      });
    }

    // 배경 그림 (우주 색 + 성운)은 한 번만 그려두고 계속 가져다 씀
    const bg = document.createElement("canvas");
    bg.width = W; bg.height = H;
    (function paintBackground() {
      const b = bg.getContext("2d");
      const sky = b.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#0a0524");
      sky.addColorStop(0.6, "#060a24");
      sky.addColorStop(1, "#02020c");
      b.fillStyle = sky;
      b.fillRect(0, 0, W, H);
      // 은은한 성운 (보라 / 파랑 빛 덩어리)
      const clouds = [[110, 180, 170, "rgba(255,61,242,0.13)"],
                      [380, 330, 200, "rgba(46,249,255,0.10)"],
                      [200, 520, 160, "rgba(120,80,255,0.12)"]];
      for (const [x, y, r, c] of clouds) {
        const g = b.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, c);
        g.addColorStop(1, "rgba(0,0,0,0)");
        b.fillStyle = g;
        b.fillRect(0, 0, W, H);
      }
    })();

    // =========================================================
    // 2. 소리 (음악 파일 없이 브라우저가 직접 소리를 만듦)
    // =========================================================
    let audio = null;        // 소리 장치 (처음 버튼을 누를 때 만들어짐)
    let master, sfxVol, musicVol, noiseBuf;
    let soundOn = true;
    try { soundOn = localStorage.getItem("starSound") !== "off"; } catch (e) {}

    function initAudio() {
      if (audio) { audio.resume(); return; }
      audio = new (window.AudioContext || window.webkitAudioContext)();
      master = audio.createGain();           // 전체 볼륨
      master.gain.value = soundOn ? 0.5 : 0;
      master.connect(audio.destination);
      sfxVol = audio.createGain();           // 효과음 볼륨
      sfxVol.gain.value = 0.9;
      sfxVol.connect(master);
      musicVol = audio.createGain();         // 배경음악 볼륨
      musicVol.gain.value = 0.35;
      musicVol.connect(master);
      // "치익" 소리를 위한 잡음 (폭발, 심벌 소리에 씀)
      noiseBuf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }

    // 삐- 소리 하나 내기: 시작 높이 → 끝 높이, 길이, 소리 종류, 크기, 시작 시각
    function tone(freq, endFreq, dur, type, vol, at, out) {
      if (!audio) return;
      const t = at || audio.currentTime;
      const osc = audio.createOscillator();
      const g = audio.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g);
      g.connect(out || sfxVol);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    // 치익- 잡음 소리 내기 (점점 낮아지는 필터로 "펑" 느낌)
    function noise(dur, vol, fromHz, toHz, at, out) {
      if (!audio) return;
      const t = at || audio.currentTime;
      const src = audio.createBufferSource();
      src.buffer = noiseBuf;
      const filter = audio.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(fromHz, t);
      filter.frequency.exponentialRampToValueAtTime(toHz, t + dur);
      const g = audio.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(filter); filter.connect(g); g.connect(out || sfxVol);
      src.start(t);
      src.stop(t + dur + 0.02);
    }

    // 효과음들
    const sfx = {
      shoot()   { tone(1200, 380, 0.09, "square", 0.08); },
      explode() { noise(0.35, 0.5, 3000, 150); tone(180, 40, 0.3, "triangle", 0.35); },
      item()    { [523, 659, 784, 1047].forEach((f, i) =>
                    tone(f, f, 0.09, "triangle", 0.22, audio && audio.currentTime + i * 0.07)); },
      hurt()    { noise(0.4, 0.5, 1500, 100); tone(320, 70, 0.4, "sawtooth", 0.2); },
      shield()  { tone(900, 1800, 0.15, "sine", 0.25); },
      stage()   { [392, 523, 659, 784].forEach((f, i) =>
                    tone(f, f, 0.14, "square", 0.08, audio && audio.currentTime + i * 0.1)); },
      gameOver() {
        [523, 440, 349, 262].forEach((f, i) =>
          tone(f, f * 0.97, i === 3 ? 0.8 : 0.25, "sawtooth", 0.16, audio && audio.currentTime + i * 0.28));
      }
    };

    // ----- 배경음악: 4개 화음이 반복되는 짧은 곡 -----
    // 화음: 라단조(Am) → 파(F) → 도(C) → 솔(G), 각 8박자
    const CHORDS = [
      { bass: 110.00, notes: [440.00, 523.25, 659.25] },  // Am
      { bass:  87.31, notes: [349.23, 440.00, 523.25] },  // F
      { bass: 130.81, notes: [523.25, 659.25, 783.99] },  // C
      { bass:  98.00, notes: [392.00, 493.88, 587.33] }   // G
    ];
    const STEP = 60 / 140 / 2;   // 한 박자 길이 (빠르기 140)
    let musicTimer = null, musicStep = 0, nextNoteAt = 0;

    function playStep(step, at) {
      const chord = CHORDS[Math.floor(step / 8) % 4];
      // 베이스: 낮은 음 / 한 옥타브 위 음을 번갈아
      const bassFreq = step % 2 === 0 ? chord.bass : chord.bass * 2;
      tone(bassFreq, bassFreq, STEP * 0.9, "triangle", 0.35, at, musicVol);
      // 반짝이는 멜로디: 화음 음을 오르내림
      const order = [0, 1, 2, 1];
      const lead = chord.notes[order[step % 4]];
      tone(lead, lead, STEP * 0.6, "square", 0.05, at, musicVol);
      // 칙칙 박자 소리
      if (step % 2 === 1) noise(0.04, 0.08, 9000, 6000, at, musicVol);
    }

    function startMusic() {
      if (!audio || musicTimer) return;
      musicStep = 0;
      nextNoteAt = audio.currentTime + 0.05;
      // 조금 앞의 음까지 미리 예약해 두어 소리가 끊기지 않게 함
      musicTimer = setInterval(function () {
        while (nextNoteAt < audio.currentTime + 0.15) {
          playStep(musicStep, nextNoteAt);
          nextNoteAt += STEP;
          musicStep = (musicStep + 1) % 32;
        }
      }, 40);
    }

    function stopMusic() {
      clearInterval(musicTimer);
      musicTimer = null;
    }

    // 소리 켜기/끄기
    function toggleSound() {
      soundOn = !soundOn;
      try { localStorage.setItem("starSound", soundOn ? "on" : "off"); } catch (e) {}
      if (audio) master.gain.setTargetAtTime(soundOn ? 0.5 : 0, audio.currentTime, 0.02);
      showSoundButton();
    }
    function showSoundButton() {
      soundBtn.textContent = soundOn ? "🔊 소리 켬" : "🔇 소리 끔";
      soundBtn.classList.toggle("off", !soundOn);
    }
    soundBtn.addEventListener("click", function () {
      toggleSound();
      soundBtn.blur();   // 스페이스바가 이 버튼을 누르지 않게
    });
    showSoundButton();

    // =========================================================
    // 3. 게임 시작 / 스테이지 / 끝내기
    // =========================================================
    // 외계인 4줄 x 8칸 새로 배치하기
    function makeFleet() {
      aliens = [];
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          // mode: "line"(대열 안) / "dive"(급강하 중) / "back"(대열로 돌아가는 중)
          aliens.push({ row: row, col: col, alive: true, mode: "line", x: 0, y: 0, t: 0 });
        }
      }
      fleet.x = (W - COLS * CELL_W) / 2;
      fleet.y = FLEET_TOP;
      fleet.dir = 1;
    }

    function startGame() {
      score = 0;
      lives = 3;
      stage = 1;
      bullets = [];
      enemyBullets = [];
      items = [];
      pieces = [];
      rings = [];
      ship.x = W / 2;
      ship.cooldown = 0;
      ship.doubleShot = 0;
      ship.shield = false;
      ship.invincible = 0;
      makeFleet();
      bannerTimer = 120;   // 약 2초 동안 "스테이지 1" 표시

      state = "playing";
      overlay.classList.add("hidden");
      startBtn.blur();  // 버튼에 남은 선택 표시 없애기 (스페이스바가 버튼을 누르지 않게)

      initAudio();      // 소리 장치 켜기 (브라우저는 버튼을 눌러야 소리를 낼 수 있음)
      startMusic();
      sfx.stage();
    }

    // 외계인을 다 물리치면 다음 스테이지로
    function nextStage() {
      stage++;
      bullets = [];
      enemyBullets = [];
      makeFleet();
      bannerTimer = 120;
      sfx.stage();
    }

    function gameOver() {
      state = "over";
      stopMusic();
      sfx.gameOver();
      titleEl.textContent = "게임 오버";
      titleEl.style.color = NEON.red;
      msgEl.textContent = "스테이지 " + stage + " · 점수 " + score;
      startBtn.textContent = "다시 시작";
      overlay.classList.remove("hidden");
    }

    startBtn.addEventListener("click", startGame);

    // =========================================================
    // 4. 조작 (키보드 + 마우스 + 터치)
    // =========================================================
    const keys = { left: false, right: false, fire: false };

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft")  keys.left = true;
      if (e.key === "ArrowRight") keys.right = true;
      if (e.key === "m" || e.key === "M") toggleSound();
      if (e.key === " ") {
        keys.fire = true;
        if (state === "playing") e.preventDefault(); // 화면이 아래로 내려가는 것 막기
      }
    });
    document.addEventListener("keyup", function (e) {
      if (e.key === "ArrowLeft")  keys.left = false;
      if (e.key === "ArrowRight") keys.right = false;
      if (e.key === " ")          keys.fire = false;
    });

    // 마우스 위치를 게임 화면 좌표로 바꾸기 (화면 크기가 달라도 맞도록)
    function toGameX(clientX) {
      const rect = canvas.getBoundingClientRect();
      return (clientX - rect.left) * (W / rect.width);
    }
    canvas.addEventListener("mousemove", function (e) {
      if (state === "playing") ship.x = toGameX(e.clientX);
    });
    canvas.addEventListener("mousedown", function () {
      if (state === "playing") shoot();
    });
    // 휴대폰 터치도 지원
    canvas.addEventListener("touchmove", function (e) {
      if (state === "playing") { ship.x = toGameX(e.touches[0].clientX); e.preventDefault(); }
    }, { passive: false });
    canvas.addEventListener("touchstart", function (e) {
      if (state === "playing") { ship.x = toGameX(e.touches[0].clientX); shoot(); e.preventDefault(); }
    }, { passive: false });

    function shoot() {
      if (ship.cooldown > 0) return;      // 너무 빨리 연속으로 못 쏘게
      if (ship.doubleShot > 0) {
        // 초록 아이템 효과: 두 발씩
        bullets.push({ x: ship.x - 9, y: ship.y - 12 });
        bullets.push({ x: ship.x + 9, y: ship.y - 12 });
      } else {
        bullets.push({ x: ship.x, y: ship.y - 20 });
      }
      ship.cooldown = 16;
      sfx.shoot();
    }

    // =========================================================
    // 5. 매 순간 게임 상태 바꾸기
    // =========================================================
    // 외계인의 지금 위치 (대열 안이면 대열 기준, 급강하 중이면 자기 위치)
    function alienPos(a) {
      if (a.mode !== "line") return { x: a.x, y: a.y };
      return { x: fleet.x + a.col * CELL_W + CELL_W / 2,
               y: fleet.y + a.row * CELL_H + CELL_H / 2 };
    }

    // 내가 맞았을 때
    function hurtPlayer(force) {
      if (ship.invincible > 0 && !force) return;   // 무적 시간에는 안 맞음
      if (ship.shield && !force) {
        // 노란 아이템 방어막이 대신 막아줌
        ship.shield = false;
        ship.invincible = 60;
        explode(ship.x, ship.y - 10, NEON.yellow, 10);
        sfx.shield();
        return;
      }
      lives--;
      explode(ship.x, ship.y, NEON.cyan, 26);
      shake = 14;
      sfx.hurt();
      enemyBullets = [];          // 화면의 외계인 총알 치우기
      ship.invincible = 120;      // 2초 동안 무적 (깜빡임)
      if (lives <= 0) gameOver();
    }

    function update() {
      // --- 내 우주선 ---
      if (keys.left)  ship.x -= ship.speed;
      if (keys.right) ship.x += ship.speed;
      ship.x = Math.max(22, Math.min(W - 22, ship.x));
      if (ship.cooldown > 0) ship.cooldown--;
      if (ship.doubleShot > 0) ship.doubleShot--;
      if (ship.invincible > 0) ship.invincible--;
      if (keys.fire) shoot();

      // --- 내 총알 ---
      for (const b of bullets) b.y -= 9;
      bullets = bullets.filter(b => b.y > -10);

      // --- 아이템 떨어지기 + 줍기 ---
      for (const it of items) {
        it.y += 2;
        if (Math.abs(it.x - ship.x) < 24 && Math.abs(it.y - ship.y) < 22) {
          if (it.type === "green") ship.doubleShot = 600;   // 10초 (1초에 60번)
          else ship.shield = true;
          rings.push({ x: it.x, y: it.y, r: 6, life: 25,
                       color: it.type === "green" ? NEON.green : NEON.yellow });
          sfx.item();
          it.y = H + 100;  // 주운 아이템 없애기
        }
      }
      items = items.filter(it => it.y < H + 20);

      // "스테이지 N" 글자가 나오는 동안은 외계인이 가만히 있음
      if (bannerTimer > 0) {
        bannerTimer--;
        return;
      }

      const alive = aliens.filter(a => a.alive);
      const inLine = alive.filter(a => a.mode === "line");

      // --- 외계인 무리 좌우로 움직이기 ---
      // 스테이지가 오를수록, 외계인이 적을수록 빨라짐
      const speed = 0.6 + (stage - 1) * 0.35 + (ROWS * COLS - alive.length) * 0.06;
      fleet.x += fleet.dir * speed;

      // 벽에 닿으면 방향 바꾸고 한 칸 내려오기
      let left = W, right = 0, bottom = 0;
      for (const a of inLine) {
        const p = alienPos(a);
        left = Math.min(left, p.x - 16);
        right = Math.max(right, p.x + 16);
        bottom = Math.max(bottom, p.y + 14);
      }
      if ((fleet.dir > 0 && right > W - 8) || (fleet.dir < 0 && left < 8)) {
        fleet.dir *= -1;
        fleet.y += 16;
      }

      // --- 급강하: 스테이지 2부터 가끔 대열에서 빠져나옴 ---
      const divers = alive.filter(a => a.mode !== "line").length;
      const maxDivers = Math.min(stage - 1, 4);           // 동시에 내려오는 수 제한
      if (divers < maxDivers && inLine.length > 0 && Math.random() < 0.004 * stage) {
        const a = inLine[Math.floor(Math.random() * inLine.length)];
        const p = alienPos(a);
        a.mode = "dive";
        a.x = p.x; a.y = p.y;
        a.startX = p.x;
        a.side = p.x < W / 2 ? 1 : -1;   // 화면 가운데 쪽으로 휘어짐
        a.t = 0;
      }
      for (const a of alive) {
        if (a.mode === "dive") {
          // 곡선 그리며 내려오기: 아래로 쭉 + 좌우로 크게 흔들기
          a.t++;
          a.y += 2.5 + stage * 0.3;
          a.x = a.startX + a.side * 110 * Math.sin(a.t / 30);
          if (a.y > H + 20) {
            // 화면 아래로 나가면 위에서 다시 나타나 대열로 돌아감
            a.mode = "back";
            a.y = -20;
          }
        } else if (a.mode === "back") {
          const home = { x: fleet.x + a.col * CELL_W + CELL_W / 2,
                         y: fleet.y + a.row * CELL_H + CELL_H / 2 };
          const dx = home.x - a.x, dy = home.y - a.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 5) a.mode = "line";
          else { a.x += dx / dist * 4; a.y += dy / dist * 4; }
        }
      }

      // --- 외계인이 총 쏘기 (대열에서 각 열의 맨 아래 외계인만) ---
      const shootChance = 0.012 + (stage - 1) * 0.006 + (ROWS * COLS - alive.length) * 0.001;
      if (inLine.length > 0 && Math.random() < shootChance) {
        const shooter = inLine[Math.floor(Math.random() * inLine.length)];
        let lowest = shooter;
        for (const a of inLine) {
          if (a.col === shooter.col && a.row > lowest.row) lowest = a;
        }
        const p = alienPos(lowest);
        enemyBullets.push({ x: p.x, y: p.y + 12 });
      }
      for (const eb of enemyBullets) eb.y += 4 + stage * 0.3;
      enemyBullets = enemyBullets.filter(eb => eb.y < H + 10);

      // --- 내 총알이 외계인에 맞았는지 ---
      for (const b of bullets) {
        for (const a of alive) {
          if (!a.alive) continue;
          const p = alienPos(a);
          if (Math.abs(b.x - p.x) < 17 && Math.abs(b.y - p.y) < 15) {
            a.alive = false;
            b.y = -100;                    // 총알 없애기
            score += 10;                   // 한 마리에 10점
            explode(p.x, p.y, ALIEN_COLORS[a.row], 16);
            sfx.explode();
            // 10% 확률로 아이템 떨어뜨리기 (초록/노랑 반반)
            if (Math.random() < 0.1) {
              items.push({ x: p.x, y: p.y, type: Math.random() < 0.5 ? "green" : "yellow" });
            }
            break;
          }
        }
      }

      // --- 외계인 총알이 나한테 맞았는지 ---
      for (const eb of enemyBullets) {
        if (Math.abs(eb.x - ship.x) < 16 && eb.y > ship.y - 16 && eb.y < ship.y + 16) {
          eb.y = H + 100;
          hurtPlayer();
          if (state !== "playing") return;
        }
      }

      // --- 급강하하는 외계인과 부딪혔는지 ---
      for (const a of alive) {
        if (a.mode === "line" || !a.alive) continue;
        if (Math.abs(a.x - ship.x) < 26 && Math.abs(a.y - ship.y) < 24) {
          if (ship.invincible > 0) continue;
          a.alive = false;                 // 부딪힌 외계인도 터짐
          explode(a.x, a.y, ALIEN_COLORS[a.row], 16);
          hurtPlayer();
          if (state !== "playing") return;
        }
      }

      // --- 대열이 내 우주선까지 내려왔는지 ---
      if (inLine.length > 0 && bottom > ship.y - 16) {
        fleet.y = FLEET_TOP;   // 대열은 다시 위로 밀려나고
        hurtPlayer(true);      // 목숨 하나 잃음 (방어막으로 못 막음)
        if (state !== "playing") return;
      }

      // --- 외계인을 다 물리쳤으면 다음 스테이지 ---
      if (aliens.every(a => !a.alive)) nextStage();
    }

    // 폭발: 작은 세모 조각들이 빙글빙글 돌며 흩어짐 + 빛 고리
    function explode(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const power = Math.random() * 3.5 + 1;
        pieces.push({
          x: x, y: y,
          vx: Math.cos(angle) * power, vy: Math.sin(angle) * power,
          rot: Math.random() * Math.PI * 2,         // 기울어진 정도
          spin: (Math.random() - 0.5) * 0.4,        // 도는 속도
          size: Math.random() * 4 + 2,
          life: 40 + Math.random() * 20, maxLife: 60,
          color: Math.random() < 0.25 ? NEON.white : color
        });
      }
      rings.push({ x: x, y: y, r: 4, life: 20, color: color });
    }

    function updateEffects() {
      for (const p of pieces) {
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.97; p.vy = p.vy * 0.97 + 0.05;  // 점점 느려지고 살짝 아래로 떨어짐
        p.rot += p.spin;
        p.life--;
      }
      pieces = pieces.filter(p => p.life > 0);
      for (const r of rings) { r.r += 2.2; r.life--; }
      rings = rings.filter(r => r.life > 0);
      if (shake > 0) shake--;
    }

    // =========================================================
    // 6. 그리기 - 우주선, 외계인, 아이템, 하트
    // =========================================================

    // 네온 빛 켜기 / 끄기
    function glow(color, size) { pen.shadowColor = color; pen.shadowBlur = size; }
    function noGlow() { pen.shadowBlur = 0; }

    // 내 우주선: 날개가 뒤로 꺾인 화살촉 모양 + 네온 테두리 + 엔진 불꽃
    function drawShip(x, y) {
      // 엔진 불꽃 (깜빡깜빡)
      const flame = 9 + Math.sin(time * 0.6) * 4;
      glow(NEON.orange, 14);
      pen.fillStyle = NEON.orange;
      pen.beginPath();
      pen.moveTo(x - 5, y + 13);
      pen.lineTo(x, y + 13 + flame);
      pen.lineTo(x + 5, y + 13);
      pen.fill();
      pen.fillStyle = NEON.yellow;
      pen.beginPath();
      pen.moveTo(x - 2.5, y + 13);
      pen.lineTo(x, y + 13 + flame * 0.5);
      pen.lineTo(x + 2.5, y + 13);
      pen.fill();

      // 몸체 (어두운 속 + 밝은 네온 테두리)
      pen.beginPath();
      pen.moveTo(x, y - 20);        // 뾰족한 앞부분
      pen.lineTo(x + 6, y - 6);
      pen.lineTo(x + 20, y + 8);    // 오른쪽 날개 끝
      pen.lineTo(x + 8, y + 6);
      pen.lineTo(x + 6, y + 14);
      pen.lineTo(x - 6, y + 14);
      pen.lineTo(x - 8, y + 6);
      pen.lineTo(x - 20, y + 8);    // 왼쪽 날개 끝
      pen.lineTo(x - 6, y - 6);
      pen.closePath();
      pen.fillStyle = "#101a4a";
      pen.fill();
      glow(NEON.cyan, 16);
      pen.strokeStyle = NEON.cyan;
      pen.lineWidth = 2.2;
      pen.stroke();

      // 날개 끝 불빛 (두 발 발사 중이면 초록색)
      const tip = ship.doubleShot > 0 ? NEON.green : NEON.pink;
      glow(tip, 10);
      pen.fillStyle = tip;
      pen.fillRect(x - 20, y + 6, 6, 3);
      pen.fillRect(x + 14, y + 6, 6, 3);

      // 조종석
      glow(NEON.pink, 10);
      pen.fillStyle = NEON.pink;
      pen.beginPath();
      pen.ellipse(x, y - 3, 3, 6.5, 0, 0, Math.PI * 2);
      pen.fill();

      // 방어막 (노란 동그라미)
      if (ship.shield) {
        glow(NEON.yellow, 18);
        pen.strokeStyle = NEON.yellow;
        pen.lineWidth = 2.5;
        pen.globalAlpha = 0.6 + Math.sin(time * 0.15) * 0.3;
        pen.beginPath();
        pen.arc(x, y, 28, 0, Math.PI * 2);
        pen.stroke();
        pen.globalAlpha = 1;
      }
      noGlow();
    }

    // 외계인 4종류 (줄마다 다름). wiggle = 0 또는 1 로 바뀌며 꿈틀거림
    function drawAlien(type, x, y, wiggle) {
      const color = ALIEN_COLORS[type];
      pen.fillStyle = color;
      pen.strokeStyle = color;
      pen.lineWidth = 2.5;
      glow(color, 14);

      if (type === 0) {
        // 1번째 줄: 해파리 - 둥근 머리 + 흐느적거리는 다리
        pen.beginPath();
        pen.arc(x, y - 2, 13, Math.PI, 0);
        pen.closePath();
        pen.fill();
        for (let i = -1.5; i <= 1.5; i++) {
          const sx = x + i * 7;
          pen.beginPath();
          pen.moveTo(sx, y - 2);
          pen.quadraticCurveTo(sx + (wiggle ? 5 : -5), y + 6, sx, y + 13);
          pen.stroke();
        }
        noGlow();
        eyes(x, y - 6, 5);

      } else if (type === 1) {
        // 2번째 줄: 수정 - 마름모 몸 + 옆으로 나왔다 들어가는 가시
        pen.beginPath();
        pen.moveTo(x, y - 14);
        pen.lineTo(x + 12, y);
        pen.lineTo(x, y + 14);
        pen.lineTo(x - 12, y);
        pen.closePath();
        pen.fill();
        const spike = wiggle ? 18 : 15;
        pen.beginPath();
        pen.moveTo(x - 12, y); pen.lineTo(x - spike, y - 5);
        pen.moveTo(x - 12, y); pen.lineTo(x - spike, y + 5);
        pen.moveTo(x + 12, y); pen.lineTo(x + spike, y - 5);
        pen.moveTo(x + 12, y); pen.lineTo(x + spike, y + 5);
        pen.stroke();
        noGlow();
        pen.fillStyle = "#0a0524";   // 가운데 눈 하나
        pen.beginPath();
        pen.arc(x, y, 4, 0, Math.PI * 2);
        pen.fill();

      } else if (type === 2) {
        // 3번째 줄: 딱정벌레 - 타원 몸 + 더듬이 + 움직이는 다리
        pen.beginPath();
        pen.moveTo(x - 5, y - 8); pen.lineTo(x - 9, y - 15);
        pen.moveTo(x + 5, y - 8); pen.lineTo(x + 9, y - 15);
        const leg = wiggle ? 4 : -2;
        pen.moveTo(x - 10, y + 2); pen.lineTo(x - 17, y + 6 + leg);
        pen.moveTo(x + 10, y + 2); pen.lineTo(x + 17, y + 6 + leg);
        pen.moveTo(x - 8, y + 6);  pen.lineTo(x - 13, y + 12 - leg);
        pen.moveTo(x + 8, y + 6);  pen.lineTo(x + 13, y + 12 - leg);
        pen.stroke();
        pen.beginPath();
        pen.ellipse(x, y, 12, 9, 0, 0, Math.PI * 2);
        pen.fill();
        pen.beginPath();             // 더듬이 끝 동그라미
        pen.arc(x - 9, y - 15, 2.5, 0, Math.PI * 2);
        pen.arc(x + 9, y - 15, 2.5, 0, Math.PI * 2);
        pen.fill();
        noGlow();
        eyes(x, y - 2, 4);

      } else {
        // 4번째 줄: 외눈 방울 - 동그란 몸 + 큰 눈 + 고리
        pen.beginPath();
        pen.ellipse(x, y + 2, 17, 5, 0, 0, Math.PI * 2);
        pen.stroke();
        pen.beginPath();
        pen.arc(x, y, 11, 0, Math.PI * 2);
        pen.fill();
        noGlow();
        pen.fillStyle = "white";
        pen.beginPath();
        pen.arc(x, y - 1, 6, 0, Math.PI * 2);
        pen.fill();
        pen.fillStyle = "#0a0524";   // 눈동자가 좌우로 굴러감
        pen.beginPath();
        pen.arc(x + (wiggle ? 2.5 : -2.5), y - 1, 3, 0, Math.PI * 2);
        pen.fill();
      }
      noGlow();
    }

    // 눈 두 개
    function eyes(x, y, gap) {
      pen.fillStyle = "#0a0524";
      pen.beginPath();
      pen.arc(x - gap, y, 2.8, 0, Math.PI * 2);
      pen.arc(x + gap, y, 2.8, 0, Math.PI * 2);
      pen.fill();
    }

    // 아이템: 빛나는 동그라미 (초록 = 두 발, 노랑 = 방어막)
    function drawItem(it) {
      const color = it.type === "green" ? NEON.green : NEON.yellow;
      glow(color, 20);
      pen.strokeStyle = color;
      pen.lineWidth = 2;
      pen.beginPath();
      pen.arc(it.x, it.y, 13 + Math.sin(time * 0.2) * 2, 0, Math.PI * 2);  // 바깥 고리
      pen.stroke();
      pen.fillStyle = color;
      pen.beginPath();
      pen.arc(it.x, it.y, 9, 0, Math.PI * 2);
      pen.fill();
      noGlow();
      // 안쪽 그림
      pen.fillStyle = "#0a0524";
      if (it.type === "green") {
        // 총알 두 줄
        pen.fillRect(it.x - 4, it.y - 5, 2.5, 10);
        pen.fillRect(it.x + 1.5, it.y - 5, 2.5, 10);
      } else {
        // 방패 모양
        pen.beginPath();
        pen.moveTo(it.x - 5, it.y - 5);
        pen.lineTo(it.x + 5, it.y - 5);
        pen.lineTo(it.x + 5, it.y);
        pen.lineTo(it.x, it.y + 6);
        pen.lineTo(it.x - 5, it.y);
        pen.closePath();
        pen.fill();
      }
    }

    // 하트 (목숨 표시)
    function drawHeart(x, y, filled) {
      pen.beginPath();
      pen.moveTo(x, y + 6);
      pen.bezierCurveTo(x - 10, y - 1, x - 7, y - 10, x, y - 4);
      pen.bezierCurveTo(x + 7, y - 10, x + 10, y - 1, x, y + 6);
      if (filled) {
        glow(NEON.red, 12);
        pen.fillStyle = NEON.red;
        pen.fill();
        noGlow();
      } else {
        pen.strokeStyle = "#4a4f80";
        pen.lineWidth = 1.5;
        pen.stroke();
      }
    }

    // 네온 글자
    function neonText(text, x, y, color, size, align) {
      pen.font = "bold " + size + "px 'Malgun Gothic', sans-serif";
      pen.textAlign = align;
      glow(color, 12);
      pen.fillStyle = color;
      pen.fillText(text, x, y);
      noGlow();
    }

    function draw() {
      pen.save();
      // 맞았을 때 화면이 살짝 흔들림
      if (shake > 0) pen.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

      // 배경 (우주 + 성운)
      pen.drawImage(bg, -10, -10, W + 20, H + 20);

      // 배경 별: 천천히 아래로 흐르기
      for (const s of stars) {
        s.y += s.speed;
        if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
        pen.globalAlpha = 0.55 + Math.sin(time * 0.05 + s.x) * 0.35;
        pen.fillStyle = s.color;
        pen.fillRect(s.x, s.y, s.size, s.size);
      }
      pen.globalAlpha = 1;

      // 외계인
      const wiggle = Math.floor(time / 20) % 2;
      for (const a of aliens) {
        if (!a.alive) continue;
        const p = alienPos(a);
        drawAlien(a.row, p.x, p.y, wiggle);
      }

      // 아이템
      for (const it of items) drawItem(it);

      // 내 총알: 하늘색 레이저
      glow(NEON.cyan, 12);
      pen.fillStyle = NEON.cyan;
      for (const b of bullets) pen.fillRect(b.x - 2, b.y - 9, 4, 16);
      pen.fillStyle = "white";
      for (const b of bullets) pen.fillRect(b.x - 0.8, b.y - 8, 1.6, 14);

      // 외계인 총알: 빨간 빛 구슬
      glow(NEON.red, 14);
      for (const eb of enemyBullets) {
        pen.fillStyle = NEON.red;
        pen.beginPath();
        pen.arc(eb.x, eb.y, 4.5, 0, Math.PI * 2);
        pen.fill();
        pen.fillStyle = "white";
        pen.beginPath();
        pen.arc(eb.x, eb.y, 1.6, 0, Math.PI * 2);
        pen.fill();
      }
      noGlow();

      // 우주선 (게임 오버면 안 그림, 무적 시간에는 깜빡임)
      const blink = ship.invincible > 0 && Math.floor(ship.invincible / 5) % 2 === 0;
      if (state !== "over" && !blink) drawShip(ship.x, ship.y);

      // 폭발 빛 고리
      for (const r of rings) {
        pen.globalAlpha = r.life / 20;
        glow(r.color, 16);
        pen.strokeStyle = r.color;
        pen.lineWidth = 2.5;
        pen.beginPath();
        pen.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        pen.stroke();
      }
      // 폭발 조각 (작은 세모가 돌면서 흩어짐)
      for (const p of pieces) {
        pen.globalAlpha = Math.min(1, p.life / 30);
        glow(p.color, 8);
        pen.fillStyle = p.color;
        pen.save();
        pen.translate(p.x, p.y);
        pen.rotate(p.rot);
        pen.beginPath();
        pen.moveTo(0, -p.size);
        pen.lineTo(p.size * 0.8, p.size * 0.7);
        pen.lineTo(-p.size * 0.8, p.size * 0.7);
        pen.closePath();
        pen.fill();
        pen.restore();
      }
      pen.globalAlpha = 1;
      noGlow();
      pen.restore();

      // ----- 화면 위쪽: 점수 / 스테이지 / 목숨 -----
      neonText("점수 " + score, 14, 30, NEON.white, 18, "left");
      neonText("스테이지 " + stage, W / 2, 30, NEON.cyan, 18, "center");
      for (let i = 0; i < 3; i++) drawHeart(W - 70 + i * 24, 24, i < lives);

      // ----- 화면 아래쪽: 아이템 효과 남은 시간 -----
      if (state === "playing" && ship.doubleShot > 0) {
        neonText("두 발 발사 " + Math.ceil(ship.doubleShot / 60) + "초", 14, H - 16, NEON.green, 14, "left");
      }

      // ----- 스테이지 시작 글자 -----
      if (state === "playing" && bannerTimer > 0) {
        pen.globalAlpha = Math.min(1, bannerTimer / 30);
        neonText("스테이지 " + stage, W / 2, H / 2 + 40, NEON.pink, 50, "center");
        if (stage > 1) neonText("외계인이 더 빨라졌어요!", W / 2, H / 2 + 78, NEON.yellow, 18, "center");
        pen.globalAlpha = 1;
      }
    }

    // =========================================================
    // 7. 게임 반복 (1초에 약 60번)
    // =========================================================
    function loop() {
      time++;
      if (state === "playing") update();
      updateEffects();
      draw();
      requestAnimationFrame(loop);
    }

    makeFleet();   // 시작 화면에서도 외계인이 보이도록 미리 배치
    loop();
  </script>
</body>
</html>
